<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FireUp"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>FireUp</title><script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>FireUp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: single phone-width column, sticky week strip on top, fixed tab bar at the bottom, sheets slide up for add/edit. */
:root{
  --bg:#0b0d0b; --surface:#141714; --surface-2:#1b1f1b; --line:#2a302a;
  --fg:#eef2ec; --muted:#8b968a; --accent:#3ee05a; --accent-ink:#06210c;
  --accent-soft:rgba(62,224,90,.14); --glow:rgba(62,224,90,.35);
  --warn:#ff4d4d; --warn-soft:rgba(255,77,77,.14); --gold:#f5c542;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-block:12px 120px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand svg{width:22px;height:22px}
.top .date{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day small{font-size:11px;color:var(--muted)}
.day b{font-family:var(--f-display);font-size:16px;font-weight:500}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--muted)}
.day.full{border-color:var(--accent);box-shadow:0 0 12px -4px var(--glow)}
.day.full i{background:var(--accent)}
.day.sel{background:var(--surface-2);border-color:var(--fg)}
.day.full.sel{border-color:var(--accent)}
.day.today small{color:var(--accent)}

.level{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.level .flame{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--surface-2)}
.level .flame svg{width:24px;height:24px}
.level .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.level .row{display:flex;align-items:baseline;gap:10px}
.level .lv{font-family:var(--f-display);font-weight:700;font-size:18px}
.level .xp{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.level .next{margin-left:auto;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease}

.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px}
.stat{padding:14px 6px;text-align:center;display:flex;flex-direction:column;gap:4px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec h2{margin:0;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}

.task{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 12px;display:flex;flex-direction:column;gap:10px}
.task.done{border-color:rgba(62,224,90,.45);background:linear-gradient(180deg,rgba(62,224,90,.06),rgba(62,224,90,.02)),var(--surface)}
.thead{display:flex;align-items:center;gap:12px}
.ico{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--surface-2)}
.ico svg{width:22px;height:22px}
.task.done .ico{background:var(--accent);color:var(--accent-ink)}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.tname{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.task.done .tname{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.tsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--warn-soft);color:var(--warn);font-variant-numeric:tabular-nums}
.pill.late{background:var(--warn);color:#fff}
.ok{color:var(--accent);font-weight:700}
.actions{display:flex;align-items:center;gap:8px}
.finger{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.finger svg{width:22px;height:22px}
.finger .ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 22px,#000 23px);mask:radial-gradient(circle,transparent 22px,#000 23px);pointer-events:none}
.check{width:36px;height:36px;display:grid;place-items:center;color:var(--accent)}
.check svg{width:22px;height:22px}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:18px;font-weight:700}
.mini.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:34px;text-align:center}
.tbar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.tbar span{display:block;height:100%;background:var(--accent)}
.items{display:flex;flex-direction:column;gap:2px;padding-left:56px}
.item{display:flex;align-items:center;gap:10px;padding:6px 0;text-align:left;font-size:14px}
.item .box{width:18px;height:18px;flex:none;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center}
.item.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.on .lbl{color:var(--muted);text-decoration:line-through}
.empty{border:1px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center;color:var(--muted);line-height:1.5}
.note{font-size:12px;color:var(--muted);text-align:center}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.tabs nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:16px;color:var(--muted);font-size:11px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--fg);background:var(--surface-2)}
.plus{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 20px -6px rgba(255,255,255,.3)}
.plus svg{width:26px;height:26px}

/* cards for other views */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:13px;font-family:var(--f-mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:4px 0 0}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.rank{display:flex;flex-direction:column;gap:8px}
.rank .r{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
.rank .r .bar{grid-column:1/-1}
.rank .r span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ach{display:flex;gap:12px;align-items:center}
.ach .badge{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.ach .badge svg{width:24px;height:24px}
.ach.won .badge{background:var(--accent);color:var(--accent-ink)}
.ach .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ach .m b{font-size:14px}
.ach .m small{color:var(--muted);font-size:12px}
.ach .m .bar{height:5px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tlist{display:flex;flex-direction:column}
.tlist button{display:flex;align-items:center;gap:12px;padding:10px 0;text-align:left;border-top:1px solid var(--line)}
.tlist button:first-child{border-top:0}
.tlist .ico{width:36px;height:36px;border-radius:11px}
.tlist .ico svg{width:18px;height:18px}
.tlist small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-top:2px}
.btn{height:46px;border-radius:14px;padding:0 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.block{width:100%}
.sync{font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:500px;max-height:92%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h2{margin:0;font-family:var(--f-display);font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>span{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:0 12px;font:inherit;width:100%;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button,.dsel button{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}
.seg button.on,.dsel button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icons button{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.icons button svg{width:20px;height:20px}
.icons button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subitems{display:flex;flex-direction:column;gap:6px}
.subitems .r{display:flex;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;white-space:nowrap;animation:up .2s ease}
/* ---- v2: neon glass look ---- */
:root{--glass:rgba(18,22,18,.66);--glass-2:rgba(30,36,30,.7);--edge:rgba(255,255,255,.07);--hl:inset 0 1px 0 rgba(255,255,255,.06)}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
   radial-gradient(70% 45% at 10% -5%,rgba(62,224,90,.22),transparent 70%),
   radial-gradient(55% 40% at 105% 60%,rgba(62,224,90,.10),transparent 70%),
   radial-gradient(60% 35% at 50% 110%,rgba(30,140,60,.18),transparent 70%),
   radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/22px 22px}
#embers{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
.brand span{background:linear-gradient(180deg,#fff,#b9ffc6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(62,224,90,.25)}
.brand svg{width:26px;height:26px;filter:drop-shadow(0 0 8px var(--glow))}
.day,.level,.stats,.task,.card,.tabs nav,.kpi{background:var(--glass);border-color:var(--edge);box-shadow:var(--hl);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.day.full{border-color:rgba(62,224,90,.75);box-shadow:0 0 16px -4px var(--glow),inset 0 0 12px -6px var(--glow)}
.day.full b{color:#b9ffc6}
.day.sel{background:var(--glass-2);border-color:rgba(255,255,255,.55)}
.day.full.sel{border-color:var(--accent);background:rgba(62,224,90,.12)}
.level{padding:16px}
.level .flame{width:52px;height:52px;border-radius:16px;background:radial-gradient(circle at 50% 70%,rgba(62,224,90,.35),rgba(62,224,90,.05) 70%);border:1px solid rgba(62,224,90,.3)}
.level .flame svg{width:32px;height:32px;filter:drop-shadow(0 0 10px var(--glow))}
.level .lv{font-size:20px}
.bar>span,.tbar span{background:linear-gradient(90deg,#1fae3c,#3ee05a 60%,#b6ff7a);box-shadow:0 0 10px var(--glow)}
.stat b{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.stat b svg{width:18px;height:18px;color:var(--accent);filter:drop-shadow(0 0 6px var(--glow))}
.task{border-radius:20px}
.task.done{border-color:rgba(62,224,90,.5);background:linear-gradient(180deg,rgba(62,224,90,.10),rgba(62,224,90,.03)),var(--glass);box-shadow:0 0 22px -12px var(--glow),var(--hl)}
.ico{width:46px;height:46px;border-radius:14px;color:#f4f7f3;
  background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:background .3s,color .3s,box-shadow .3s}
.ico svg{width:24px;height:24px;filter:drop-shadow(0 0 5px rgba(255,255,255,.18))}
.task.done .ico,.ach.won .badge,.icons button.on{color:#062a10;background:linear-gradient(150deg,#b6ff7a,#3ee05a 45%,#17a63a);border-color:transparent;box-shadow:0 4px 16px -4px var(--glow),inset 0 1px 0 rgba(255,255,255,.5)}
.task.done .ico svg,.ach.won .badge svg,.icons button.on svg{filter:none}
.finger{background:var(--glass-2);border-color:rgba(62,224,90,.3);color:var(--accent);box-shadow:0 0 14px -6px var(--glow)}
.check{filter:drop-shadow(0 0 6px var(--glow))}
.mini{background:var(--glass-2);border-color:var(--edge)}
.mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{border:1px solid rgba(255,77,77,.35)}
.tabs{background:linear-gradient(180deg,transparent,rgba(11,13,11,.9) 40%)}
.tabs nav{border-radius:26px}
.tab.on{color:#b9ffc6;background:rgba(62,224,90,.12)}
.plus{background:linear-gradient(150deg,#b6ff7a,#3ee05a 50%,#17a63a);color:#062a10;box-shadow:0 0 0 4px rgba(62,224,90,.12),0 8px 26px -6px var(--glow)}
.ach .badge{color:#f4f7f3;background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.10)}
.ach:not(.won) .badge{opacity:.6}
.icons{grid-template-columns:repeat(8,1fr)}
.seg.seg4{grid-template-columns:repeat(4,1fr)}
.seg.seg2{grid-template-columns:1fr 1fr}
.newsbox{width:min(400px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:20px 20px 18px;border-radius:26px;background:rgba(14,18,14,.96);border:1px solid rgba(62,224,90,.35);box-shadow:0 0 60px -12px var(--glow);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.nwhead{display:flex;align-items:center;justify-content:space-between}
.nwfl{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% 70%,rgba(62,224,90,.35),rgba(62,224,90,.05) 70%);border:1px solid rgba(62,224,90,.3)}
.nwfl svg.fl{width:44px;height:44px}
.nwlang{display:flex;padding:3px;border-radius:12px;background:var(--glass-2);border:1px solid var(--edge)}
.nwlang button{min-width:40px;height:30px;border-radius:9px;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted)}
.nwlang button.on{background:var(--fg);color:var(--bg)}
.nweb{font-family:var(--f-mono);font-size:11px;letter-spacing:.25em;color:#b9ffc6;margin-top:4px}
.newsbox h2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.2;text-wrap:balance}
.nwlist{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nwi{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--edge);animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
.nwi:first-child{border-top:0}
.nwic{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:#062a10;background:linear-gradient(150deg,#b6ff7a,#3ee05a 45%,#17a63a);box-shadow:0 4px 14px -4px var(--glow)}
.nwic svg{width:20px;height:20px}
.nwi b{display:block;font-size:15px;margin-bottom:3px}
.nwi p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.nwlink{padding:10px 12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--edge);display:flex;flex-direction:column;gap:4px}
.nwlink small{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.nwlink a{color:var(--accent);font-family:var(--f-mono);font-size:13px;word-break:break-all;user-select:text}
.nwlink .mini svg{width:16px;height:16px}
.newsrow{flex-direction:row!important;align-items:center;gap:12px!important;text-align:left;cursor:pointer}
.newsrow .nwic{width:38px;height:38px}
.newsrow span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:2px}

  const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,50,true);setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),300)},2300)}
function bumpLevel(){const L=levelOf(totalXP()).L,prev=S.lv||L;S.lv=L;if(L>prev)setTimeout(()=>levelUp(prev,L),1500)}
/* complete with animation: card flashes, sparks fly, then it moves to Splnené */
function finish(t,v,from){
  const c=document.querySelector(`[data-card="${t.id}"]`);SFX.done();buzz([18,40,28]);
  if(c){c.classList.add("completing");const r=(from||c).getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,38);
    setTimeout(()=>setLog(t,sel,v),420)}else setLog(t,sel,v);
}
function levelUp(prev,L){
  const changed=tierOf(L)!==tierOf(prev),T=TIERS[tierOf(L)];SFX.lvl();
  setTimeout(()=>{const b=document.querySelector(".lvflame");if(b){const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,70,true);setTimeout(()=>burst(r.left+r.width/2,r.top+r.height/2,40,true),350)}},120);
  $("#layer").innerHTML=`<div class="scrim lvup" id="scrim"><div class="lvbox" role="dialog" aria-modal="true"><div class="lvflame"><i class="rays"></i>${flameSVG(L,"big")}</div><small>LEVEL UP</small><b>LVL ${L}</b><p>${changed?`Tvoj oheň sa zmenil na <strong>${T.name}</strong>.`:`Tvoj ${T.name.toLowerCase()} rastie. Len tak ďalej.`}</p><button class="btn block" id="lvOk">Pokračovať</button></div></div>`;
  $("#lvOk").onclick=closeLayer;$("#scrim").onclick=e=>{if(e.target.id==="scrim")closeLayer()};
  if(navigator.vibrate)try{navigator.vibrate([30,60,30])}catch(e){}
}

/* ---------- render ---------- */
function render(){
  const a=$("#app");
  if(view==="today")a.innerHTML=renderToday();
  else if(view==="stats")a.innerHTML=renderStats();
  else if(view==="ch")a.innerHTML=renderCh();
  else a.innerHTML=renderProfile();
  clearTimeout(window.__et);if(ENTER){a.classList.remove("enter");void a.offsetWidth;a.classList.add("enter");ENTER=false;window.__et=setTimeout(()=>a.classList.remove("enter"),900)}else a.classList.remove("enter");
  renderTabs();bind();tick();
  const bars=a.querySelectorAll("[data-w]");bars.forEach(b=>{const k=b.dataset.k,w=b.dataset.w;b.style.width=(k in PW?PW[k]:0)+"%";PW[k]=w});
  requestAnimationFrame(()=>requestAnimationFrame(()=>bars.forEach(b=>b.style.width=b.dataset.w+"%")));
}
function header(){const d=new Date();return `<div class="top"><div class="brand">${FLAME}<span>FIREUP</span></div><div class="tr"><div class="date">${S.name?esc(S.name)+" · ":""}${d.getDate()}. ${MN[d.getMonth()]}</div><button class="snd" data-mute aria-label="${S.mute?"Zapnúť zvuky":"Vypnúť zvuky"}">${svg(S.mute?'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 5 6M22 9l-5 6"/>':'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>')}</button></div></div>`}
function renderToday(){
  const today=new Date(),mon=addDays(today,-wd(today));
  let wk="";for(let i=0;i<7;i++){const d=addDays(mon,i),k=key(d),s=dayStat(k);
    wk+=`<button class="day${s.total?" has":""}${s.full?" full":""}${k===sel?" sel":""}${k===key(today)?" today":""}" data-day="${k}" aria-label="${DNL[i]} ${d.getDate()}"><small>${DN[i]}</small><b>${d.getDate()}</b><i></i></button>`}
  const xp=totalXP(),lv=levelOf(xp),s=dayStat(sel),st=streak();
  const ts=tasksOn(sel).sort((x,y)=>(x.time||"99")<(y.time||"99")?-1:1);
  const open=ts.filter(t=>!isDone(t,sel)),done=ts.filter(t=>isDone(t,sel));
  const sd=fromKey(sel);
  let list="";
  if(!ts.length) list=`<div class="empty">Na tento deň nemáš nič naplánované.<br>Pridaj si úlohu tlačidlom <b>+</b> dole.</div>`;
  else{
    if(open.length) list+=`<div class="list">${open.map(t=>taskCard(t,sel)).join("")}</div>`;
    if(done.length) list+=`<div class="sec"><h2>Splnené</h2><span>${done.length}</span></div><div class="list">${done.map(t=>taskCard(t,sel)).join("")}</div>`;
  }
  return `${header()}
  <div class="week">${wk}</div>
  <div class="level"><div class="flame">${flameSVG(lv.L)}</div><div class="meta"><div class="row"><span class="lv">LVL ${lv.L}</span><span class="tier">${TIERS[tierOf(lv.L)].name}</span><span class="xp">${xp} XP</span><span class="next">${lv.need-lv.into} XP do LVL ${lv.L+1}</span></div><div class="bar"><span data-k="lvl" data-w="${(lv.into/lv.need*100).toFixed(1)}"></span></div></div></div>
  <div class="stats"><div class="stat"><b>${s.done}/${s.total}</b><small>Úlohy</small></div><div class="stat"><b>${ico("flame")}${st}</b><small>Séria (dni)</small></div><div class="stat"><b>${s.total?Math.round(s.done/s.total*100):0}%</b><small>Úspešnosť</small></div></div>
  ${(()=>{const dq=dailyQuests(sel);if(!dq.length)return"";const n=dq.filter(q=>q.done).length;return `<button class="qstrip${n===dq.length?" all":""}" data-view="ch"><span class="qi">${ico("flame")}</span><span class="qm"><b>Denné questy</b><small>${n}/${dq.length} splnené · až +${dq.reduce((a,q)=>a+q.xp,0)} XP</small></span><span class="qdots">${dq.map(q=>`<i class="${q.done?"on":""}"></i>`).join("")}</span></button>`})()}
  <div class="sec"><h2>Pripomienky</h2><span>${DNL[wd(sd)]} ${sd.getDate()}. ${MN[sd.getMonth()]}</span></div>
  ${list}
  ${S.example?`<p class="note">Toto sú ukážkové úlohy. Ťukni na úlohu a uprav ju alebo zmaž.</p>`:""}`;
}
function taskCard(t,k){
  const done=isDone(t,k),v=(S.log[k]||{})[t.id],isToday=k===key(new Date());
  let sub="";
  if(t.time)sub+=`<span>${t.time}</span>`;
  if(t.week)sub+=`<span class="wtag">1 týždeň</span>`;
  if(done)sub+=`<span class="ok">splnené</span>`;
  else if(isToday&&t.time)sub+=`<span class="pill" data-due="${t.time}"></span>`;
  let act="",extra="";
  if(t.type==="single"){
    act=done?`<button class="check" data-undo="${t.id}" aria-label="Vrátiť späť">${svg(IC.check,2.4)}</button>`
            :`<button class="finger" data-hold="${t.id}" aria-label="Podrž pre splnenie">${FINGER}<span class="ring"></span></button>`;
  }else if(t.type==="count"){
    const c=v||0;sub+=`<span class="${FX.count===t.id?"bump":""}">${countLabel(t,c)}</span>`;
    act=`<button class="mini" data-dec="${t.id}" aria-label="Ubrať">−</button><button class="mini${done?" on":""}" data-inc="${t.id}" aria-label="Pridať">+</button>`;
    extra=`<div class="tbar"><span data-k="t${t.id}" data-w="${Math.min(100,c/t.goal*100)}"></span></div>`;
  }else{
    const arr=Array.isArray(v)?v:[];const c=t.items.filter((_,i)=>arr[i]).length;
    sub+=`<span>${c}/${t.items.length}</span>`;
    act=done?`<button class="check" data-undo="${t.id}" aria-label="Vrátiť späť">${svg(IC.check,2.4)}</button>`
            :`<button class="finger" data-hold="${t.id}" aria-label="Podrž pre splnenie všetkého">${FINGER}<span class="ring"></span></button>`;
    extra=`<div class="items">${t.items.map((it,i)=>`<button class="item${arr[i]?" on":""}${FX.item===t.id+":"+i?" just":""}" data-item="${t.id}:${i}"><span class="box">${arr[i]?svg(IC.check,3):""}</span><span class="lbl">${esc(it)}</span></button>`).join("")}</div>`;
  }
  return `<div class="task${done?" done":""}${FX.done===t.id?" just":""}${FX.undo===t.id?" back":""}" data-card="${t.id}"><div class="thead"><div class="ico">${ico(t.icon)}</div><button class="tmain" data-edit="${t.id}"><span class="tname">${esc(t.name)}</span><span class="tsub">${sub}</span></button><div class="actions">${act}</div></div>${extra}</div>`;
}
function tick(){
  const now=new Date();
  document.querySelectorAll("[data-cd]").forEach(el=>{const end=el.dataset.cd==="day"?addDays(fromKey(key(now)),1):addDays(fromKey(monKey(key(now))),7);
    let s=Math.max(0,Math.round((end-now)/1000));const dd=Math.floor(s/86400);s%=86400;
    el.textContent=`nové o ${dd?dd+"d ":""}${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`});
  document.querySelectorAll("[data-due]").forEach(el=>{
    const [h,m]=el.dataset.due.split(":").map(Number);const due=new Date(now);due.setHours(h,m,0,0);
    let diff=Math.round((due-now)/1000);const late=diff<0;diff=Math.abs(diff);
    const s=`${pad(Math.floor(diff/3600))}:${pad(Math.floor(diff%3600/60))}:${pad(diff%60)}`;
    el.textContent=late?`po čase ${s}`:`zostáva ${s}`;el.classList.toggle("late",late);
  });
}
setInterval(tick,1000);

function renderStats(){
  const days=30,end=new Date();let bars=[],sum=0,cnt=0;
  for(let i=days-1;i>=0;i--){const d=addDays(end,-i),k=key(d),s=dayStat(k);const p=s.total?s.done/s.total:null;bars.push({d,p});if(p!==null&&k>=earliest()){sum+=p;cnt++}}
  const W=320,H=120,bw=W/days;
  let g=`<line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/><line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
  bars.forEach((b,i)=>{const h=b.p===null?0:Math.max(2,b.p*(H-4));g+=`<rect x="${i*bw+1.5}" y="${H-h}" width="${bw-3}" height="${h}" rx="2" fill="${b.p===1?"var(--accent)":"var(--muted)"}" opacity="${b.p===1?1:.55}"/>`});
  g+=`<text x="0" y="${H+14}" font-size="9" fill="var(--muted)" font-family="JetBrains Mono,monospace">${bars[0].d.getDate()}.${bars[0].d.getMonth()+1}.</text><text x="${W}" y="${H+14}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="JetBrains Mono,monospace">dnes</text>`;
  const bp=bestStreakAndPerfect();
  const per=S.tasks.map(t=>{let tot=0,ok=0;for(let i=0;i<days;i++){const k=key(addDays(end,-i));if(k<t.from)continue;if(!t.days.includes(wd(fromKey(k))))continue;tot++;if(isDone(t,k))ok++}return{t,tot,ok,p:tot?ok/tot:0}}).filter(x=>x.tot).sort((a,b)=>b.p-a.p);
  return `${header()}<p class="h1">Štatistiky</p>
  <div class="grid2"><div class="kpi"><b>${cnt?Math.round(sum/cnt*100):0}%</b><small>priemer za 30 dní</small></div><div class="kpi"><b>${totalDone()}</b><small>splnených úloh spolu</small></div><div class="kpi"><b>${streak()}</b><small>aktuálna séria</small></div><div class="kpi"><b>${bp.best}</b><small>najdlhšia séria</small></div></div>
  <div class="card"><h3>Posledných 30 dní</h3><div class="chart"><svg viewBox="0 -4 ${W} ${H+22}" role="img" aria-label="Úspešnosť za posledných 30 dní">${g}</svg></div><small class="note" style="text-align:left">Zelená = splnený celý deň.</small></div>
  <div class="card"><h3>Úlohy za 30 dní</h3><div class="rank">${per.map(x=>`<div class="r"><b>${esc(x.t.name)}</b><span>${x.ok}/${x.tot}</span><div class="bar"><span style="width:${x.p*100}%"></span></div></div>`).join("")||'<span class="note">Zatiaľ žiadne dáta.</span>'}</div></div>`;
}
function questCard(q){const D=DIFF[q.diff],steps=q.steps||[],sd=q.stepDone||[],n=steps.filter((_,i)=>sd[i]).length;
  const late=q.due&&q.due<key(new Date());const dd=q.due?fromKey(q.due):null;
  return `<div class="task quest qd-${q.diff}${FX.q===q.id?" just":""}" data-qcard="${q.id}"><div class="thead"><div class="ico">${ico(q.icon||"check")}</div><button class="tmain" data-qedit="${q.id}"><span class="tname">${esc(q.name)}</span><span class="tsub"><span class="dtag">${D.n}</span><span class="xpb">+${D.xp} XP</span>${dd?`<span class="${late?"pill late":""}">${late?"po termíne":"do "+dd.getDate()+". "+(dd.getMonth()+1)+"."}</span>`:""}${steps.length?`<span>${n}/${steps.length}</span>`:""}</span></button><div class="actions"><button class="finger" data-qhold="${q.id}" aria-label="Podrž pre splnenie questu">${FINGER}<span class="ring"></span></button></div></div>
  ${steps.length?`<div class="items">${steps.map((it,i)=>`<button class="item${sd[i]?" on":""}${FX.qi===q.id+":"+i?" just":""}" data-qstep="${q.id}:${i}"><span class="box">${sd[i]?svg(IC.check,3):""}</span><span class="lbl">${esc(it)}</span></button>`).join("")}</div>`:""}</div>`}

/* ---------- interactions ---------- */
function find(id){return S.tasks.find(t=>t.id===id)}
function bind(){
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{if(view===b.dataset.view)return;SFX.tab();view=b.dataset.view;ENTER=true;render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openEditor(null));
  document.querySelectorAll("[data-mute]").forEach(b=>b.onclick=()=>{S.mute=!S.mute;save();render();SFX.tap()});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{if(sel===b.dataset.day)return;SFX.tap();sel=b.dataset.day;ENTER=true;render()});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(find(b.dataset.edit)));
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.undo);SFX.undo();buzz(12);setLog(t,sel,t.type==="list"?[]:false)});
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.inc),nv=+(((S.log[sel]||{})[t.id]||0)+stepOf(t)).toFixed(3);
    if(nv>=t.goal-1e-9&&!isDone(t,sel)){finish(t,nv,b);return}
    (t.icon==="drop"?SFX.drop:SFX.pop)();buzz(10);const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,8);setLog(t,sel,nv,{count:1})});
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.dec);SFX.undo();buzz(8);setLog(t,sel,Math.max(0,+(((S.log[sel]||{})[t.id]||0)-stepOf(t)).toFixed(3)),{count:1})});
  document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{const [id,i]=b.dataset.item.split(":");const t=find(id);const arr=[...(((S.log[sel]||{})[id])||[])];arr[+i]=!arr[+i];
    if(arr[+i]&&t.items.every((_,j)=>arr[j])&&!isDone(t,sel)){finish(t,arr,b);return}
    (arr[+i]?SFX.tick:SFX.undo)();buzz(8);setLog(t,sel,arr,{item:arr[+i]?b.dataset.item:null})});
  document.querySelectorAll("[data-hold]").forEach(b=>{
