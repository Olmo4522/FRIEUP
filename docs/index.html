<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0d0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FireUp"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>FireUp</title><script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>FireUp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
/* Layout: single phone-width column, sticky week strip on top, fixed tab bar at the bottom, sheets slide up for add/edit. */
:root{
  --bg:#0b0d0b; --surface:#141714; --surface-2:#1b1f1b; --line:#2a302a;
  --fg:#eef2ec; --muted:#8b968a; --accent:#3ee05a; --acc-rgb:62,224,90; --acc-hi:#b6ff7a; --acc-lo:#17a63a; --acc-ink:#062a10; --acc-pale:#b9ffc6; --accent-ink:#06210c;
  --accent-soft:rgba(62,224,90,.14); --glow:rgba(62,224,90,.35);
  --warn:#ff4d4d; --warn-soft:rgba(255,77,77,.14); --gold:#f5c542;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-block:12px 120px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand svg{width:22px;height:22px}
.top .date{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day small{font-size:11px;color:var(--muted)}
.day b{font-family:var(--f-display);font-size:16px;font-weight:500}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--muted)}
.day.full{border-color:var(--accent);box-shadow:0 0 12px -4px var(--glow)}
.day.full i{background:var(--accent)}
.day.sel{background:var(--surface-2);border-color:var(--fg)}
.day.full.sel{border-color:var(--accent)}
.day.today small{color:var(--accent)}

.level{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.level .flame{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--surface-2)}
.level .flame svg{width:24px;height:24px}
.level .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.level .row{display:flex;align-items:baseline;gap:10px}
.level .lv{font-family:var(--f-display);font-weight:700;font-size:18px}
.level .xp{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.level .next{margin-left:auto;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease}

.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px}
.stat{padding:14px 6px;text-align:center;display:flex;flex-direction:column;gap:4px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec h2{margin:0;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}

.task{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 12px;display:flex;flex-direction:column;gap:10px}
.task.done{border-color:rgba(var(--acc-rgb),.45);background:linear-gradient(180deg,rgba(var(--acc-rgb),.06),rgba(var(--acc-rgb),.02)),var(--surface)}
.thead{display:flex;align-items:center;gap:12px}
.ico{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--surface-2)}
.ico svg{width:22px;height:22px}
.task.done .ico{background:var(--accent);color:var(--accent-ink)}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.tname{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.task.done .tname{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.tsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--warn-soft);color:var(--warn);font-variant-numeric:tabular-nums}
.pill.late{background:var(--warn);color:#fff}
.ok{color:var(--accent);font-weight:700}
.actions{display:flex;align-items:center;gap:8px}
.finger{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.finger svg{width:22px;height:22px}
.finger .ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 22px,#000 23px);mask:radial-gradient(circle,transparent 22px,#000 23px);pointer-events:none}
.check{width:36px;height:36px;display:grid;place-items:center;color:var(--accent)}
.check svg{width:22px;height:22px}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:18px;font-weight:700}
.mini.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:34px;text-align:center}
.tbar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.tbar span{display:block;height:100%;background:var(--accent)}
.items{display:flex;flex-direction:column;gap:2px;padding-left:56px}
.item{display:flex;align-items:center;gap:10px;padding:6px 0;text-align:left;font-size:14px}
.item .box{width:18px;height:18px;flex:none;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center}
.item.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.on .lbl{color:var(--muted);text-decoration:line-through}
.empty{border:1px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center;color:var(--muted);line-height:1.5}
.note{font-size:12px;color:var(--muted);text-align:center}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.tabs nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:16px;color:var(--muted);font-size:11px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--fg);background:var(--surface-2)}
.plus{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 20px -6px rgba(255,255,255,.3)}
.plus svg{width:26px;height:26px}

/* cards for other views */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:13px;font-family:var(--f-mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:4px 0 0}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.rank{display:flex;flex-direction:column;gap:8px}
.rank .r{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
.rank .r .bar{grid-column:1/-1}
.rank .r span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ach{display:flex;gap:12px;align-items:center}
.ach .badge{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.ach .badge svg{width:24px;height:24px}
.ach.won .badge{background:var(--accent);color:var(--accent-ink)}
.ach .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ach .m b{font-size:14px}
.ach .m small{color:var(--muted);font-size:12px}
.ach .m .bar{height:5px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tlist{display:flex;flex-direction:column}
.tlist button{display:flex;align-items:center;gap:12px;padding:10px 0;text-align:left;border-top:1px solid var(--line)}
.tlist button:first-child{border-top:0}
.tlist .ico{width:36px;height:36px;border-radius:11px}
.tlist .ico svg{width:18px;height:18px}
.tlist small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-top:2px}
.btn{height:46px;border-radius:14px;padding:0 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.block{width:100%}
.sync{font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:500px;max-height:92%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h2{margin:0;font-family:var(--f-display);font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>span{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:0 12px;font:inherit;width:100%;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button,.dsel button{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}
.seg button.on,.dsel button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icons button{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.icons button svg{width:20px;height:20px}
.icons button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subitems{display:flex;flex-direction:column;gap:6px}
.subitems .r{display:flex;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;white-space:nowrap;animation:up .2s ease}
/* ---- v2: neon glass look ---- */
:root{--glass:rgba(18,22,18,.66);--glass-2:rgba(30,36,30,.7);--edge:rgba(255,255,255,.07);--hl:inset 0 1px 0 rgba(255,255,255,.06)}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
   radial-gradient(70% 45% at 10% -5%,rgba(var(--acc-rgb),.22),transparent 70%),
   radial-gradient(55% 40% at 105% 60%,rgba(var(--acc-rgb),.10),transparent 70%),
   radial-gradient(60% 35% at 50% 110%,rgba(30,140,60,.18),transparent 70%),
   radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/22px 22px}
#embers{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
.brand span{background:linear-gradient(180deg,#fff,var(--acc-pale));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(var(--acc-rgb),.25)}
.brand svg{width:26px;height:26px;filter:drop-shadow(0 0 8px var(--glow))}
.day,.level,.stats,.task,.card,.tabs nav,.kpi{background:var(--glass);border-color:var(--edge);box-shadow:var(--hl);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.day.full{border-color:rgba(var(--acc-rgb),.75);box-shadow:0 0 16px -4px var(--glow),inset 0 0 12px -6px var(--glow)}
.day.full b{color:var(--acc-pale)}
.day.sel{background:var(--glass-2);border-color:rgba(255,255,255,.55)}
.day.full.sel{border-color:var(--accent);background:rgba(var(--acc-rgb),.12)}
.level{padding:16px}
.level .flame{width:52px;height:52px;border-radius:16px;background:radial-gradient(circle at 50% 70%,rgba(var(--acc-rgb),.35),rgba(var(--acc-rgb),.05) 70%);border:1px solid rgba(var(--acc-rgb),.3)}
.level .flame svg{width:32px;height:32px;filter:drop-shadow(0 0 10px var(--glow))}
.level .lv{font-size:20px}
.bar>span,.tbar span{background:linear-gradient(90deg,var(--acc-lo),var(--accent) 60%,var(--acc-hi));box-shadow:0 0 10px var(--glow)}
.stat b{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.stat b svg{width:18px;height:18px;color:var(--accent);filter:drop-shadow(0 0 6px var(--glow))}
.task{border-radius:20px}
.task.done{border-color:rgba(var(--acc-rgb),.5);background:linear-gradient(180deg,rgba(var(--acc-rgb),.10),rgba(var(--acc-rgb),.03)),var(--glass);box-shadow:0 0 22px -12px var(--glow),var(--hl)}
.ico{width:46px;height:46px;border-radius:14px;color:#f4f7f3;
  background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:background .3s,color .3s,box-shadow .3s}
.ico svg{width:24px;height:24px;filter:drop-shadow(0 0 5px rgba(255,255,255,.18))}
.task.done .ico,.ach.won .badge,.icons button.on{color:var(--acc-ink);background:linear-gradient(150deg,var(--acc-hi),var(--accent) 45%,var(--acc-lo));border-color:transparent;box-shadow:0 4px 16px -4px var(--glow),inset 0 1px 0 rgba(255,255,255,.5)}
.task.done .ico svg,.ach.won .badge svg,.icons button.on svg{filter:none}
.finger{background:var(--glass-2);border-color:rgba(var(--acc-rgb),.3);color:var(--accent);box-shadow:0 0 14px -6px var(--glow)}
.check{filter:drop-shadow(0 0 6px var(--glow))}
.mini{background:var(--glass-2);border-color:var(--edge)}
.mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{border:1px solid rgba(255,77,77,.35)}
.tabs{background:linear-gradient(180deg,transparent,rgba(11,13,11,.9) 40%)}
.tabs nav{border-radius:26px}
.tab.on{color:var(--acc-pale);background:rgba(var(--acc-rgb),.12)}
.plus{background:linear-gradient(150deg,var(--acc-hi),var(--accent) 50%,var(--acc-lo));color:var(--acc-ink);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.12),0 8px 26px -6px var(--glow)}
.ach .badge{color:#f4f7f3;background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.10)}
.ach:not(.won) .badge{opacity:.6}
.icons{grid-template-columns:repeat(8,1fr)}
.seg.seg4{grid-template-columns:repeat(4,1fr)}
.seg.seg2{grid-template-columns:1fr 1fr}
html.has-bgsk body::before{background:var(--bgsk)}
html.lightsk{--fg:#111812;--muted:#5d6a5c;--line:#d9e1d8;--surface:#ffffff;--surface-2:#eef2ed;--glass:rgba(255,255,255,.72);--glass-2:rgba(255,255,255,.9);--edge:rgba(20,30,20,.10);--hl:inset 0 1px 0 rgba(255,255,255,.9);--warn-soft:rgba(220,38,38,.10);color-scheme:light}
html.lightsk .ico{color:#27312a;background:linear-gradient(150deg,rgba(0,0,0,.06),rgba(0,0,0,.015));border-color:rgba(0,0,0,.08);box-shadow:none}
html.lightsk .ico svg{filter:none}
html.lightsk .brand span{background:linear-gradient(180deg,#111812,#3a4a3c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
html.lightsk .tabs{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 92%,transparent) 40%)}
html.lightsk .tabs nav,html.lightsk .day,html.lightsk .level,html.lightsk .stats,html.lightsk .task,html.lightsk .card,html.lightsk .kpi,html.lightsk .lbrow,html.lightsk .boxcard{box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -16px rgba(0,0,0,.18)}
html.lightsk .sheet{background:rgba(255,255,255,.97);box-shadow:0 -10px 40px -10px rgba(0,0,0,.25)}
html.lightsk .scrim{background:rgba(20,26,20,.45)}
html.lightsk .day.sel{border-color:rgba(0,0,0,.55)}
html.lightsk .pill{color:#c81e1e}
html.lightsk .xpb,html.lightsk .cd,html.lightsk .level .xp{color:#9a6c00}
html.lightsk .xpb{background:rgba(245,197,66,.16)}
html.lightsk .coinchip b,html.lightsk .cb-l b{color:#9a6c00}
html.lightsk .qstrip{background:linear-gradient(120deg,rgba(245,197,66,.2),rgba(var(--acc-rgb),.06)),var(--glass)}
html.lightsk .bigupd::after{background:linear-gradient(135deg,rgba(192,132,252,.12),rgba(var(--acc-rgb),.06) 55%,rgba(79,209,255,.10)),rgba(255,255,255,.94)}
html.lightsk .bu-cd span{background:rgba(0,0,0,.04)}
html.lightsk #bupill{background:rgba(255,255,255,.96)}
html.lightsk .bp-tx small,html.lightsk .bu-t small{color:#7c3aed}
html.lightsk .lbm em.dm,html.lightsk .chip{color:var(--muted)}
html.lightsk .skin,html.lightsk .sk-prev{background-color:rgba(0,0,0,.03)}
html.lightsk .item .box{border-color:#8a978a}

/* ---- motion & feedback ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
.tr{display:flex;align-items:center;gap:10px}

button{transition:transform .14s cubic-bezier(.3,1.6,.5,1),background-color .2s,border-color .2s,color .2s}
button:active{transform:scale(.93)}
.tab:active,.tmain:active{transform:scale(.97)}
.app.enter>*{animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
.app.enter>*:nth-child(2){animation-delay:.04s}.app.enter>*:nth-child(3){animation-delay:.08s}.app.enter>*:nth-child(4){animation-delay:.12s}.app.enter>*:nth-child(5){animation-delay:.16s}.app.enter>*:nth-child(6){animation-delay:.2s}.app.enter>*:nth-child(n+7){animation-delay:.24s}

.app.enter .list>.task:nth-child(2){animation-delay:.18s}.app.enter .list>.task:nth-child(3){animation-delay:.23s}.app.enter .list>.task:nth-child(4){animation-delay:.28s}.app.enter .list>.task:nth-child(n+5){animation-delay:.33s}

.task{transition:border-color .3s,box-shadow .3s,background .3s}

.task.just{animation:land .6s cubic-bezier(.2,1.4,.4,1)}
.task.just .ico{animation:icoPop .6s cubic-bezier(.3,1.6,.5,1)}
.task.just .check{animation:chk .5s .1s cubic-bezier(.3,1.8,.5,1) both}

.fl-sparks{animation:sparks 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.97,1.05) skewX(-2deg)}60%{transform:scale(1.02,.97) skewX(2deg)}}
@keyframes sparks{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.evo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ev{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--glass-2);border:1px solid var(--edge);text-align:center}
.ev svg.fl{width:46px;height:46px}
.ev b{font-size:13px}
.ev small{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.ev:not(.got) svg.fl{filter:grayscale(1) brightness(.5);opacity:.5}
.ev:not(.got) .fl-body,.ev:not(.got) .fl-core,.ev:not(.got) .fl-sparks{animation:none}
.ev.cur{border-color:rgba(var(--acc-rgb),.6);background:rgba(var(--acc-rgb),.08);box-shadow:0 0 16px -8px var(--glow)}
.ev.cur small{color:var(--acc-pale)}
.lvup{align-items:center;background:radial-gradient(circle at 50% 40%,rgba(var(--acc-rgb),.25),rgba(0,0,0,.8) 60%)}
.lvbox{width:min(340px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 20px 20px;border-radius:26px;background:rgba(16,20,16,.92);border:1px solid rgba(var(--acc-rgb),.35);box-shadow:0 0 60px -10px var(--glow);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.lvflame svg.fl{width:130px;height:130px}
.lvbox small{font-family:var(--f-mono);letter-spacing:.3em;color:var(--acc-pale);font-size:12px}
.lvbox b{font-family:var(--f-display);font-size:34px;font-weight:700}
.lvbox p{margin:4px 0 12px;color:var(--muted);line-height:1.5}
.lvbox p strong{color:var(--fg)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.icons button{color:#f4f7f3;background:var(--glass-2);border-color:var(--edge)}
.tlist .ico svg{width:20px;height:20px}
.sheet{background:rgba(16,20,16,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-color:var(--edge);box-shadow:0 -10px 40px -10px rgba(var(--acc-rgb),.18)}
.btn{background:linear-gradient(150deg,var(--acc-hi),var(--accent) 50%,var(--acc-lo));box-shadow:0 6px 20px -8px var(--glow)}
.btn.ghost,.btn.danger{box-shadow:none}
.btn.ghost{background:var(--glass-2)}
.btn.danger{background:var(--warn-soft)}
.toast{background:linear-gradient(150deg,var(--acc-hi),var(--accent));color:var(--acc-ink);box-shadow:0 8px 26px -6px var(--glow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#embers,#fx{display:none}}
</style>

  ${fin.length?`<details class="fin"><summary>Splnené questy (${fin.length})</summary>${fin.slice(0,15).map(q=>`<div class="finrow"><span>${ico(q.icon||"check")}</span><b>${esc(q.name)}</b><small>+${DIFF[q.diff].xp} XP · ${new Date(q.doneAt).getDate()}. ${new Date(q.doneAt).getMonth()+1}.</small></div>`).join("")}</details>`:""}</div>`;

/* ---------- interactions ---------- */
function find(id){return S.tasks.find(t=>t.id===id)}
function bind(){
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{if(view===b.dataset.view)return;SFX.tab();view=b.dataset.view;ENTER=true;render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openEditor(null));
  document.querySelectorAll("[data-mute]").forEach(b=>b.onclick=()=>{S.mute=!S.mute;save();render();SFX.tap()});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{if(sel===b.dataset.day)return;SFX.tap();sel=b.dataset.day;ENTER=true;render()});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(find(b.dataset.edit)));
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.undo);SFX.undo();buzz(12);setLog(t,sel,t.type==="list"?[]:false)});
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.inc),nv=+(((S.log[sel]||{})[t.id]||0)+stepOf(t)).toFixed(3);
    if(nv>=t.goal-1e-9&&!isDone(t,sel)){finish(t,nv,b);return}
    (t.icon==="drop"?SFX.drop:SFX.pop)();buzz(10);const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,8);setLog(t,sel,nv,{count:1})});
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const t=find(b.dataset.dec);SFX.undo();buzz(8);setLog(t,sel,Math.max(0,+(((S.log[sel]||{})[t.id]||0)-stepOf(t)).toFixed(3)),{count:1})});
  document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{const [id,i]=b.dataset.item.split(":");const t=find(id);const arr=[...(((S.log[sel]||{})[id])||[])];arr[+i]=!arr[+i];
    if(arr[+i]&&t.items.every((_,j)=>arr[j])&&!isDone(t,sel)){finish(t,arr,b);return}
    (arr[+i]?SFX.tick:SFX.undo)();buzz(8);setLog(t,sel,arr,{item:arr[+i]?b.dataset.item:null})});
  document.querySelectorAll("[data-hold]").forEach(b=>{
    let raf=null,st=0;const t=find(b.dataset.hold);
    const stop=()=>{cancelAnimationFrame(raf);raf=null;b.style.setProperty("--p",0);b.classList.remove("holding");SFX.chargeStop()};
    const go=()=>finish(t,t.type==="list"?t.items.map(()=>true):true,b);
    const step=ts=>{const p=Math.min(1,(ts-st)/650);b.style.setProperty("--p",p);if(p>=1){stop();go()}else raf=requestAnimationFrame(step)};
    b.addEventListener("pointerdown",e=>{e.preventDefault();st=performance.now();b.classList.add("holding");SFX.charge();buzz(6);raf=requestAnimationFrame(step)});
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>{if(raf)stop()}));
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
    b.addEventListener("contextmenu",e=>e.preventDefault());
  });
  document.querySelectorAll("[data-box]").forEach(b=>b.onclick=()=>{SFX.tap();openBox(b.dataset.box)});
  document.querySelectorAll("[data-scat]").forEach(b=>b.onclick=()=>{if(window.__scat===b.dataset.scat)return;SFX.tap();window.__scat=b.dataset.scat;ENTER=false;render()});
  document.querySelectorAll("[data-equip]").forEach(b=>b.onclick=()=>{const x=skinById(b.dataset.equip);S.eq=S.eq||{};if(SK(x.cat).id===x.id)return;S.eq[x.cat]=x.id;save();applySkin();SFX.save();buzz(15);ENTER=false;render();const n=document.querySelector(`[data-equip="${x.id}"]`);if(n){const r=n.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,22,false,[RAR[x.r].c,"#fff"])}toast("Nasadené: "+x.n)});
  document.querySelectorAll("[data-lbm]").forEach(b=>b.onclick=()=>{if((window.__lbm||"w")===b.dataset.lbm)return;SFX.tap();window.__lbm=b.dataset.lbm;ENTER=true;render()});
  const lbn=$("#lbName");if(lbn)lbn.onchange=()=>{const v=lbn.value.trim();if(!v)return;S.name=v;save();SFX.save();render();toast("Prezývka uložená")};
  document.querySelectorAll("[data-bumin]").forEach(b=>b.onclick=()=>{SFX.tap();const c=b.closest(".bigupd");if(c)c.classList.add("going");setTimeout(()=>{S.gtaMin=true;save();ENTER=false;render()},280)});
  document.querySelectorAll("[data-ui]").forEach(b=>b.onclick=()=>{const v=b.dataset.ui;if((S.ui||"sk")===v)return;SFX.tap();S.ui=v;S.lang=v;save();ENTER=false;render();toast(v==="en"?"Language: English":"Jazyk: slovenčina")});
  document.querySelectorAll("[data-news]").forEach(b=>b.onclick=()=>{SFX.open();showNews(true)});
  document.querySelectorAll("[data-qnew]").forEach(b=>b.onclick=()=>openQuestEditor(null));
  document.querySelectorAll("[data-qedit]").forEach(b=>b.onclick=()=>openQuestEditor(S.quests.find(q=>q.id===b.dataset.qedit)));
  document.querySelectorAll("[data-qstep]").forEach(b=>b.onclick=()=>{const [id,i]=b.dataset.qstep.split(":");const q=S.quests.find(x=>x.id===id);q.stepDone=q.stepDone||[];q.stepDone[+i]=!q.stepDone[+i];
    (q.stepDone[+i]?SFX.tick:SFX.undo)();buzz(8);if(q.stepDone[+i]&&q.steps.every((_,j)=>q.stepDone[j])){finishQuest(q,b);return}FX={qi:q.stepDone[+i]?b.dataset.qstep:null};save();render();FX={}});
  document.querySelectorAll("[data-qhold]").forEach(b=>{
    let raf=null,st=0;const q=S.quests.find(x=>x.id===b.dataset.qhold);
    const stop=()=>{cancelAnimationFrame(raf);raf=null;b.style.setProperty("--p",0);b.classList.remove("holding");SFX.chargeStop()};
    const step=ts=>{const p=Math.min(1,(ts-st)/900);b.style.setProperty("--p",p);if(p>=1){stop();finishQuest(q,b)}else raf=requestAnimationFrame(step)};
    b.addEventListener("pointerdown",e=>{e.preventDefault();st=performance.now();b.classList.add("holding");SFX.charge();buzz(6);raf=requestAnimationFrame(step)});
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>{if(raf)stop()}));
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();finishQuest(q,b)}});
    b.addEventListener("contextmenu",e=>e.preventDefault());
  });
  const pn=$("#pname");if(pn)pn.oninput=()=>{S.name=pn.value.trim();save()};
  const rs=document.querySelector("[data-reset]");if(rs)rs.onclick=()=>confirmSheet("Vymazať všetko?","Prídeš o všetky úlohy, históriu, XP aj sériu. Toto sa nedá vrátiť.","Vymazať",()=>{S={name:S.name,tasks:[],log:{},quests:[],ts:{}};save();render()});
}

 for(let d=fromKey(EV_FROM);key(d)<=today;d=addDays(d,1)){const k=key(d);const ts=tasksOn(k),dn=ts.filter(t=>isDone(t,k)).length;c+=dn*EV_TASK;if(ts.length&&dn===ts.length)c+=EV_PERFECT;dailyQuests(k).forEach(q=>{if(q.done)c+=q.xp*EV_QXP})}

const CU=k=>`https://firestore.googleapis.com/v1/projects/${FB.pid}/databases/(default)/documents/saves/${k}?key=${FB.key}`;
const cloudId=()=>{try{return localStorage.getItem("fireup_sk")||""}catch(e){return ""}};

const b64e=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function cloudKeyObj(){let hx="";try{hx=localStorage.getItem("fireup_ek")||""}catch(e){}if(!hx)return null;return crypto.subtle.importKey("raw",new Uint8Array(hx.match(/../g).map(x=>parseInt(x,16))),"AES-GCM",false,["encrypt","decrypt"])}
async function cloudEnc(str){const k=await cloudKeyObj();const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(str)));return b64e(iv)+"."+b64e(ct)}
async function cloudDec(str){const k=await cloudKeyObj();const [a,b]=str.split(".");const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(a)},k,b64d(b));return new TextDecoder().decode(pt)}
async function cloudSend(){const k=cloudId();if(!k||cloudBusy)return;cloudBusy=true;try{S.cloudAt=Date.now();lsSet();const data=await cloudEnc(JSON.stringify(S));
 const r=await fetch(CU(k),{method:"PATCH",headers:{"Content-Type":"application/json"},keepalive:data.length<60000,body:JSON.stringify({fields:{d:{stringValue:data},at:{integerValue:String(S.cloudAt)}}})});
 syncMode=r.ok?"uložené v účte":"zálohu do účtu sa nepodarilo uložiť"}catch(e){syncMode="zálohu do účtu sa nepodarilo uložiť"}cloudBusy=false}
function cloudPush(now){if(!cloudId())return;clearTimeout(cloudT);if(now)cloudSend();else cloudT=setTimeout(cloudSend,1500)}
async function cloudPull(){const k=cloudId();if(!k)return;try{const r=await fetch(CU(k));if(r.status===404){cloudPush(true);return}if(!r.ok)return;const j=await r.json(),f=j.fields||{};const at=+((f.at||{}).integerValue||0),d=(f.d||{}).stringValue;
 if(d&&at>(S.cloudAt||0)){const remote=JSON.parse(await cloudDec(d));S=remote;S.quests=S.quests||[];S.ts=S.ts||{};S.eq=S.eq||{};S.owned=S.owned||[];S.cloudAt=at;lsSet();applySkin();syncMode="uložené v účte";ENTER=false;render();remSync();toast("Progres načítaný z tvojho účtu")}
 else if(!d||at<(S.cloudAt||0))cloudPush(true);else syncMode="uložené v účte"}catch(e){}}

function remPlan(){if(S.notif===false)return[];const out=[],now=Date.now();let n=1;
 for(let d=0;d<3;d++){const day=addDays(new Date(),d),k=key(day),ts=tasksOn(k);
  ts.forEach(t=>{if(!t.time||isDone(t,k))return;const [h,m]=t.time.split(":").map(Number);const at=new Date(day);at.setHours(h,m,0,0);if(at.getTime()>now+5000)out.push({id:n++,at:at.getTime(),t:"FireUp · "+t.name,b:"Je čas na túto úlohu. Splň ju a udrž si sériu."})});
  const left=ts.filter(t=>!isDone(t,k)).length,ev=new Date(day);ev.setHours(20,0,0,0);
  if(left&&ev.getTime()>now)out.push({id:n++,at:ev.getTime(),t:"FireUp · nezabudni",b:`Dnes ti ešte ${left===1?"chýba":"chýbajú"} ${left} ${pl(left,"úloha","úlohy","úloh")}. Nestrať sériu!`})}

 webRem.forEach(clearTimeout);webRem=[];if(!("Notification" in window)||Notification.permission!=="granted")return;
 plan.filter(p=>p.at-Date.now()<864e5).forEach(p=>webRem.push(setTimeout(()=>{const o={body:p.b,icon:"icon-192.png",tag:"fu"+p.id};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(p.t,o)).catch(()=>{try{new Notification(p.t,o)}catch(e){}});else{try{new Notification(p.t,o)}catch(e){}}},p.at-Date.now())))},800)}
